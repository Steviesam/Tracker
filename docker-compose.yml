services:
  postgres:
    image: postgres:16-alpine
    container_name: social-metrics-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tracker
      POSTGRES_PASSWORD: tracker_local_dev
      POSTGRES_DB: social_metrics
    # 5434 on the host so this does not collide with other local Postgres (5432, 5433).
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracker -d social_metrics"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
